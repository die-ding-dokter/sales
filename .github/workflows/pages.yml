name: Deploy sales workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sales-pages
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          PORTAL_CLIENT_ID: ${{ vars.PORTAL_CLIENT_ID }}
          PORTAL_API_SCOPE: ${{ vars.PORTAL_API_SCOPE }}
          PORTAL_API_URL: ${{ vars.PORTAL_API_URL }}
          PORTAL_TEAMS_CHANNEL_URL: ${{ vars.PORTAL_TEAMS_CHANNEL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check publishing source
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
            core.info(`Pages publishing source: ${data.build_type}`);
            if (data.build_type !== 'workflow') {
              core.warning('A repository administrator must select Settings > Pages > Source: GitHub Actions to prevent competing legacy source builds.');
            }
      - uses: actions/deploy-pages@v4
        id: deployment
